name: Deploy Landing

on:
  push:
    branches: [ main ]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "bun.lock"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  LANDING_BUCKET: tokenoverflow-landing
  LANDING_DISTRIBUTION_ID: EUWMTMEBUDHNL
  TOKENOVERFLOW_ENV: production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build landing
        run: bun run build:landing

      - name: Sync to S3
        run: |
          aws s3 sync apps/landing/dist/ "s3://${LANDING_BUCKET}/" --delete \
            --cache-control "public, max-age=300, must-revalidate"

          aws s3 cp apps/landing/dist/_astro "s3://${LANDING_BUCKET}/_astro" \
            --recursive --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${LANDING_DISTRIBUTION_ID}" \
            --paths "/*"
