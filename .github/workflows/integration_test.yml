name: Integration Test

on:
  workflow_call:
    inputs:
      rust:
        description: Run Rust integration tests
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rust:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust_integration:
    name: Rust Integration
    if: inputs.rust
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # diesel `postgres` feature links against libpq at test time. Deploy
      # workflows side-step this via `--features bundled-libs`; tests don't.
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Rust stable toolchain
        uses: ./.github/actions/rust_toolchain
        with:
          toolchain: stable

      - name: Cargo test integration
        run: cargo test --workspace --test integration
