name: Deploy Web

on:
  push:
    branches: [ main ]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "apps/api/openapi.json"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  WEB_BUCKET: tokenoverflow-lambda-prod
  WEB_LAMBDA_NAME: web
  TOKENOVERFLOW_ENV: production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-slim
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      - name: Configure AWS credentials
        if: ${{ !github.event.act }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build BFF
        run: bun run build:web

      - name: Package zip
        run: |
          mkdir -p dist
          cd apps/web/.output/server && zip -r ../../../../dist/web.zip .

      - name: Upload to S3 and update Lambda
        if: ${{ !github.event.act }}
        run: |
          SHA=$(shasum -a 256 dist/web.zip | cut -c1-12)
          aws s3 cp dist/web.zip "s3://${WEB_BUCKET}/web/${SHA}.zip"
          aws lambda update-function-code \
            --function-name "${WEB_LAMBDA_NAME}" \
            --s3-bucket "${WEB_BUCKET}" \
            --s3-key "web/${SHA}.zip" \
            --region "$AWS_REGION"
