name: Type Check

on:
  workflow_call:
    inputs:
      ts:
        description: Type-check TypeScript packages
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  type_check:
    name: Type Check
    if: inputs.ts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Turbo `--affected` needs the previous commit to diff against.
          fetch-depth: 2

      # `astro check` shells out via Node and enforces Node >= 22.12.
      # `ubuntu-24.04-arm` ships Node 20 by default.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install Bun & dependencies
        uses: ./.github/actions/bun_install

      - name: Turbo check
        run: bun run turbo run check --affected
