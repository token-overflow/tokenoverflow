name: Playwright Install
description: >-
  Restore the Playwright browser cache for the given app, installing browsers
  + OS deps only on a cache miss.

inputs:
  app:
    description: Workspace name suffix (`landing` or `web`).
    required: true

runs:
  using: composite
  steps:
    - name: Validate app input
      shell: bash
      env:
        INPUT_APP: ${{ inputs.app }}
      run: |
        case "${INPUT_APP}" in
          landing|web) ;;
          *) echo "Invalid app: ${INPUT_APP}" >&2; exit 1 ;;
        esac

    # Browser binaries are pinned by Playwright's version in bun.lock.
    - name: Restore Playwright browser cache
      id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-v2-${{ inputs.app }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-playwright-v2-${{ inputs.app }}-

    # OS deps live outside the cached `~/.cache/ms-playwright` tree, so the
    # cache restore brings back browser binaries but not their shared libs
    # (e.g. libwoff2dec for WebKit). Install OS deps every run; install
    # browser binaries only on cache miss.
    - name: Install Playwright OS deps
      shell: bash
      env:
        INPUT_APP: ${{ inputs.app }}
      working-directory: apps/${{ inputs.app }}
      run: bunx playwright install-deps

    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_APP: ${{ inputs.app }}
      working-directory: apps/${{ inputs.app }}
      run: bunx playwright install
